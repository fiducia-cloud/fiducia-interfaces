# Dependabot: weekly automated dependency-update PRs for npm packages and GitHub Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/generated/rust"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/generated/rust-wasm"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/generated/rust-db"
    schedule:
      interval: weekly
