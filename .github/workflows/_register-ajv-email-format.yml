name: Repair AJV email format

on:
  push:
    branches:
      - alexander-mills/den-1390-commercial-intake-contracts
    paths:
      - .github/workflows/_register-ajv-email-format.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
          cache: npm

      - name: Register the official email format and regenerate
        run: |
          set -euo pipefail
          npm install --save-exact --ignore-scripts ajv-formats@3.0.1
          node scripts/repair-ajv-email.mjs
          node src/generate.mjs
          git diff --check

      - name: Run complete repository validation
        run: |
          set -euo pipefail
          npm test
          npm audit --audit-level=high

      - name: Commit verified repair and remove one-shot files
        run: |
          set -euo pipefail
          git rm -- .github/workflows/_register-ajv-email-format.yml scripts/repair-ajv-email.mjs
          git add -- package.json package-lock.json src/generate.mjs src/zod-runtime.test.ts generated/typescript/zod.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(validation): register canonical email format"
          git push origin "HEAD:${GITHUB_REF_NAME}"
