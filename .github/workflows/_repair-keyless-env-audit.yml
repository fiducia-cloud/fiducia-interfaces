name: Repair keyless environment audit

on:
  push:
    branches:
      - alexander-mills/den-1390-commercial-intake-contracts
    paths:
      - .github/workflows/_repair-keyless-env-audit.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned just
        env:
          JUST_VERSION: 1.51.0
          JUST_ARCHIVE_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_ARCHIVE_SHA256}  /tmp/just.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Repair and verify the keyless boundary
        env:
          SOPS_AGE_KEY: ""
          SOPS_AGE_KEY_FILE: ""
        run: |
          set -euo pipefail
          node scripts/repair-keyless-env-audit.mjs
          test ! -e .github/workflows/_repair-commercial-intake-ci.yml
          just env-check
          git diff --check

      - name: Commit verified repair and remove one-shot files
        run: |
          set -euo pipefail
          git rm -- .github/workflows/_repair-keyless-env-audit.yml scripts/repair-keyless-env-audit.mjs
          git add -- .just/env.just .github/workflows/secrets-audit.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(security): keep encrypted-env audit keyless"
          git push origin "HEAD:${GITHUB_REF_NAME}"
