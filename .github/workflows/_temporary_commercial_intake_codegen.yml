name: Temporary commercial intake codegen

on:
  push:
    branches:
      - alexander-mills/den-1390-commercial-intake-contracts

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Canonically format the new source schema
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'schema/commercial_intake.schema.json';
          const document = JSON.parse(fs.readFileSync(path, 'utf8'));
          fs.writeFileSync(path, `${JSON.stringify(document, null, 2)}\n`);
          NODE
      - name: Generate every checked-in language binding
        run: npm run generate
      - name: Verify generated artifacts are current
        run: npm run check
      - name: Commit generated contract artifacts
        run: |
          rm .github/workflows/_temporary_commercial_intake_codegen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schema/commercial_intake.schema.json schema/index.json generated/
          git add -u .github/workflows/_temporary_commercial_intake_codegen.yml
          git diff --cached --check
          git commit -m 'chore(intake): generate commercial contract bindings'
          git push origin "HEAD:${GITHUB_REF_NAME}"
