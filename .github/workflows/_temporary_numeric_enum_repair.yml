name: Temporary numeric enum repair

on:
  push:
    branches:
      - alexander-mills/den-1390-commercial-intake-contracts

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - run: npm ci --ignore-scripts
      - name: Replace digit-prefixed wire values
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'schema/commercial_intake.schema.json';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = new Map([
            ['"1_10"', '"employees_1_10"'],
            ['"11_50"', '"employees_11_50"'],
            ['"51_200"', '"employees_51_200"'],
            ['"201_1000"', '"employees_201_1000"'],
            ['"1001_5000"', '"employees_1001_5000"'],
            ['"5001_plus"', '"employees_5001_plus"'],
            ['"99_0"', '"availability_99_0"'],
            ['"99_5"', '"availability_99_5"'],
            ['"99_9"', '"availability_99_9"'],
            ['"99_95"', '"availability_99_95"'],
            ['"500_2000_monthly"', '"monthly_500_2000"'],
            ['"2000_10000_monthly"', '"monthly_2000_10000"'],
            ['"10000_50000_monthly"', '"monthly_10000_50000"'],
            ['"50000_plus_monthly"', '"monthly_50000_plus"'],
          ]);
          for (const [from, to] of replacements) text = text.replaceAll(from, to);
          const document = JSON.parse(text);
          fs.writeFileSync(path, `${JSON.stringify(document, null, 2)}\n`);
          NODE
      - run: npm run generate
      - run: npm run check
      - name: Compile generated Rust contract
        run: cargo check --locked --manifest-path generated/rust/Cargo.toml
      - name: Check generated Rust formatting
        run: cargo fmt --manifest-path generated/rust/Cargo.toml --all -- --check
      - name: Commit repaired source and generated bindings
        run: |
          rm .github/workflows/_temporary_numeric_enum_repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schema/commercial_intake.schema.json generated/
          git add -u .github/workflows/_temporary_numeric_enum_repair.yml
          git diff --cached --check
          git commit -m 'fix(contract): make commercial enum values codegen-safe'
          git push origin "HEAD:${GITHUB_REF_NAME}"
