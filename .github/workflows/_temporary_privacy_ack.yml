name: Temporary commercial privacy acknowledgement

on:
  push:
    branches:
      - alexander-mills/den-1390-commercial-intake-contracts

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: npm ci --ignore-scripts
      - name: Require privacy acceptance on quote and pre-interest submissions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'schema/commercial_intake.schema.json';
          const document = JSON.parse(fs.readFileSync(path, 'utf8'));
          for (const name of ['QuoteRequest', 'PreInterestRequest']) {
            const definition = document.$defs[name];
            if (!definition || !Array.isArray(definition.required) || !definition.properties) {
              throw new Error(`missing request definition: ${name}`);
            }
            if (!definition.required.includes('privacy_notice_accepted')) {
              definition.required.push('privacy_notice_accepted');
            }
            definition.properties.privacy_notice_accepted = {
              type: 'boolean',
              const: true,
              description: 'The current Fiducia privacy notice was accepted before submission.',
            };
          }
          fs.writeFileSync(path, `${JSON.stringify(document, null, 2)}\n`);
          NODE
      - run: npm run generate
      - run: npm run check
      - run: cargo check --locked --manifest-path generated/rust/Cargo.toml
      - run: cargo fmt --manifest-path generated/rust/Cargo.toml --all -- --check
      - name: Commit privacy contract and generated bindings
        run: |
          rm .github/workflows/_temporary_privacy_ack.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schema/commercial_intake.schema.json generated/
          git add -u .github/workflows/_temporary_privacy_ack.yml
          git diff --cached --check
          git commit -m 'fix(intake): require privacy acceptance on every submission'
          git push origin "HEAD:${GITHUB_REF_NAME}"
