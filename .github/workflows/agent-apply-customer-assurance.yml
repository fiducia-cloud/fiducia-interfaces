name: apply customer Shared Auth assurance patch

on:
  push:
    branches:
      - agent/shared-auth-customer-assurance-20260810
    paths:
      - .github/workflows/agent-apply-customer-assurance.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Apply reviewed adapter patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          payload = ""
          Path("/tmp/customer-assurance.patch").write_bytes(base64.b64decode(payload))
          PY
          git apply --check /tmp/customer-assurance.patch
          git apply /tmp/customer-assurance.patch
      - name: Format, lint, and test adapter
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path adapters/shared-auth-rust/Cargo.toml
          cargo fmt --manifest-path adapters/shared-auth-rust/Cargo.toml --all
          cargo clippy --locked --manifest-path adapters/shared-auth-rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path adapters/shared-auth-rust/Cargo.toml --all-targets
          rm -f adapters/shared-auth-rust/Cargo.lock
      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/agent-apply-customer-assurance.yml
          git add adapters/shared-auth-rust/src/lib.rs
          test -z "$(git status --porcelain --untracked-files=no | grep -vE '^(D | D) \.github/workflows/agent-apply-customer-assurance\.yml$|^(M | M) adapters/shared-auth-rust/src/lib\.rs$' || true)"
          git commit -m "feat(auth): preserve assurance in strict Shared Auth sessions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
