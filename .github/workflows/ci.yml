# CI for the interfaces repo: generator self-tests, staleness gates that fail if the
# checked-in generated/ files drift from the schemas/SQL, founder-governance design
# gates, and compile checks of the generated Rust and Rust->wasm crates.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push obsoletes the previous one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/ci.yml ./.github/workflows/cli-flags.yml ./.github/workflows/founder-governance.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - uses: dart-lang/setup-dart@43c102f4dc9b9829c862401f0b64c7c9184eab4e # v1
        with:
          sdk: "3.12.1"
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            generated/rust
            generated/rust-wasm
            generated/rust-db
      # One mandatory, lockfile-backed gate: generator tests + drift checks,
      # founder-governance safety/liveness tests, native Rust tests/checks,
      # DB-row compile, and TypeScript usage typing.
      - run: npm test
      - name: Generated Rust formatting and lints
        run: |
          for manifest in generated/rust/Cargo.toml generated/rust-wasm/Cargo.toml generated/rust-db/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all -- --check
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
          done
      - run: npm audit --audit-level=high
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit every Rust lockfile
        run: |
          for lock in Cargo.lock generated/rust-wasm/Cargo.lock generated/rust-db/Cargo.lock; do
            cargo audit --file "$lock"
          done

  # The generated Rust->WebAssembly crate must compile to wasm32 and produce a
  # valid wasm-bindgen package (this is what surfaces tsify type-mapping bugs).
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: generated/rust-wasm
      # Pinned, checksummed prebuilt binary — no `curl | sh`, guaranteed on PATH.
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: wasm-pack@0.15.0
      # compile gate
      - name: Compile to wasm32
        run: cargo build --locked --manifest-path generated/rust-wasm/Cargo.toml --target wasm32-unknown-unknown
      # full bindgen: emits pkg/ with the .wasm + .d.ts, validating the JS boundary
      # (--dev skips wasm-opt, avoiding an extra binaryen download)
      - name: wasm-bindgen package
        run: wasm-pack build generated/rust-wasm --target web --dev -- --locked
      # Regression guard: the generated .d.ts must not contain an undefined `Value`,
      # a `bigint` (i64 leak), or a `Map<>` (should be `Record`).
      - name: Assert generated .d.ts is clean
        run: |
          dts=$(find generated/rust-wasm/pkg -maxdepth 1 -type f -name '*.d.ts' ! -name '*_bg*' -print -quit)
          test -n "$dts"
          echo "checking $dts"
          if grep -nE ':[[:space:]]*(bigint|Map<)|:[[:space:]]*Value([;[]|$)' "$dts"; then
            echo "::error::generated .d.ts has an undefined Value, a bigint, or a Map<> — tsify type-mapping regression"
            exit 1
          fi
          echo "clean"
      # Stronger guard: the generated .d.ts must be valid TypeScript (catches any
      # unresolved type, e.g. an undefined `Value`, that the grep would miss).
      - name: Type-check generated .d.ts (tsc)
        run: |
          dts=$(find generated/rust-wasm/pkg -maxdepth 1 -type f -name '*.d.ts' ! -name '*_bg*' -print -quit)
          test -n "$dts"
          npx --no-install tsc --noEmit --lib esnext,dom "$dts"
