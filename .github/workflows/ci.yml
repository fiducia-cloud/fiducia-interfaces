# CI for the interfaces repo: generator self-tests, staleness gates that fail if the
# checked-in generated/ files drift from the schemas/SQL, founder-governance design
# gates, and compile checks of the generated Rust and Rust->wasm crates.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-customer-session-schema:
    if: github.event_name == 'push' && github.event.head_commit.message == 'ci(auth): execute customer session schema patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/customer-shared-session-assurance
          persist-credentials: true
      - name: Apply exact customer session schema patch
        run: |
          set -euo pipefail
          git fetch origin 0ad257b6708117dcc3643a9fd15b0f92ca394c1f --depth=1
          git show 0ad257b6708117dcc3643a9fd15b0f92ca394c1f:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/patch-customer-shared-session-schema.yml

          python3 - <<'PY'
          from pathlib import Path
          path = Path("sql/customer.sql")
          text = path.read_text()
          old = """  status varchar(16) default 'active' not null,
  updated_at timestamptz default now() not null,
  version bigint default 1 not null,
  sync_sequence bigint not null,
  constraint customer_sessions_status_chk check (status in ('active', 'verified', 'revoked'))
);
alter table customer_sessions add column if not exists sync_sequence bigint;
create index if not exists customer_sessions_user_idx on customer_sessions (user_id);
"""
          new = """  status varchar(16) default 'active' not null,
  shared_auth_session_id uuid,
  assurance_level varchar(16) default 'aal1' not null,
  assurance_verified_at timestamptz,
  expires_at timestamptz,
  updated_at timestamptz default now() not null,
  version bigint default 1 not null,
  sync_sequence bigint not null,
  constraint customer_sessions_status_chk check (status in ('active', 'verified', 'revoked')),
  constraint customer_sessions_assurance_level_chk check (assurance_level in ('aal1', 'aal2')),
  constraint customer_sessions_shared_auth_assurance_chk check (
    (
      shared_auth_session_id is null
      and assurance_level = 'aal1'
      and assurance_verified_at is null
      and expires_at is null
    )
    or
    (
      shared_auth_session_id is not null
      and assurance_level = 'aal2'
      and assurance_verified_at is not null
      and expires_at is not null
      and expires_at > assurance_verified_at
      and status in ('verified', 'revoked')
    )
  )
);
alter table customer_sessions add column if not exists sync_sequence bigint;
alter table customer_sessions add column if not exists shared_auth_session_id uuid;
alter table customer_sessions add column if not exists assurance_level varchar(16) not null default 'aal1';
alter table customer_sessions add column if not exists assurance_verified_at timestamptz;
alter table customer_sessions add column if not exists expires_at timestamptz;
create index if not exists customer_sessions_user_idx on customer_sessions (user_id);
create unique index if not exists customer_sessions_shared_auth_sid_uq
  on customer_sessions (shared_auth_session_id)
  where shared_auth_session_id is not null;
create index if not exists customer_sessions_user_assurance_idx
  on customer_sessions (user_id, status, expires_at desc)
  where shared_auth_session_id is not null;
alter table customer_sessions
  drop constraint if exists customer_sessions_assurance_level_chk;
alter table customer_sessions
  add constraint customer_sessions_assurance_level_chk
    check (assurance_level in ('aal1', 'aal2'));
alter table customer_sessions
  drop constraint if exists customer_sessions_shared_auth_assurance_chk;
alter table customer_sessions
  add constraint customer_sessions_shared_auth_assurance_chk check (
    (
      shared_auth_session_id is null
      and assurance_level = 'aal1'
      and assurance_verified_at is null
      and expires_at is null
    )
    or
    (
      shared_auth_session_id is not null
      and assurance_level = 'aal2'
      and assurance_verified_at is not null
      and expires_at is not null
      and expires_at > assurance_verified_at
      and status in ('verified', 'revoked')
    )
  );
"""
          if old not in text:
              raise SystemExit("canonical customer_sessions block did not match")
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(auth): bind verified Shared Auth customer sessions"
          git push origin HEAD:agent/customer-shared-session-assurance

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/ci.yml ./.github/workflows/cli-flags.yml ./.github/workflows/founder-governance.yml ./.github/workflows/package-contract.yml ./.github/workflows/shared-auth-adapter.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - uses: dart-lang/setup-dart@43c102f4dc9b9829c862401f0b64c7c9184eab4e # v1
        with:
          sdk: "3.12.1"
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            generated/rust
            generated/rust-wasm
            generated/rust-db
      - run: npm test
      - name: Generated Rust formatting and lints
        run: |
          for manifest in generated/rust/Cargo.toml generated/rust-wasm/Cargo.toml generated/rust-db/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all -- --check
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
          done
      - run: npm audit --audit-level=high
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit every Rust lockfile
        run: |
          for lock in Cargo.lock generated/rust-wasm/Cargo.lock generated/rust-db/Cargo.lock; do
            cargo audit --file "$lock"
          done

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: generated/rust-wasm
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: wasm-pack@0.15.0
      - name: Compile to wasm32
        run: cargo build --locked --manifest-path generated/rust-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: wasm-bindgen package
        run: wasm-pack build generated/rust-wasm --target web --dev -- --locked
      - name: Assert generated .d.ts is clean
        run: |
          dts=$(find generated/rust-wasm/pkg -maxdepth 1 -type f -name '*.d.ts' ! -name '*_bg*' -print -quit)
          test -n "$dts"
          echo "checking $dts"
          if grep -nE ':[[:space:]]*(bigint|Map<)|:[[:space:]]*Value([;[]|$)' "$dts"; then
            echo "::error::generated .d.ts has an undefined Value, a bigint, or a Map<> — tsify type-mapping regression"
            exit 1
          fi
          echo "clean"
      - name: Type-check generated .d.ts (tsc)
        run: |
          dts=$(find generated/rust-wasm/pkg -maxdepth 1 -type f -name '*.d.ts' ! -name '*_bg*' -print -quit)
          test -n "$dts"
          npx --no-install tsc --noEmit --lib esnext,dom "$dts"
