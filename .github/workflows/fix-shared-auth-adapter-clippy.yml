name: fix-shared-auth-adapter-clippy

on:
  push:
    branches: [agent/shared-auth-dual-guard]
    paths:
      - ".github/workflows/fix-shared-auth-adapter-clippy.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/shared-auth-dual-guard
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Apply clippy fixes and commit once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("adapters/shared-auth-rust/src/lib.rs")
          text = path.read_text()
          replacements = {
              "        identity: Identity,\n        authority: Authority,\n        elapsed_ms: u64,": "        identity: Box<Identity>,\n        authority: Authority,\n        elapsed_ms: u64,",
              "            Self::Authenticated { identity, .. } => Some(identity),": "            Self::Authenticated { identity, .. } => Some(identity.as_ref()),",
              "        identity,\n        authority,\n        elapsed_ms: started.elapsed().as_millis() as u64,": "        identity: Box::new(identity),\n        authority,\n        elapsed_ms: started.elapsed().as_millis() as u64,",
              "    exp: u64,": "    #[serde(rename = \"exp\")]\n    _expires_at: u64,",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing expected source fragment: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --manifest-path adapters/shared-auth-rust/Cargo.toml --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adapters/shared-auth-rust/src/lib.rs
          git commit -m "fix(auth): shrink outcomes and mark validated expiry"
          git push origin HEAD:agent/shared-auth-dual-guard
