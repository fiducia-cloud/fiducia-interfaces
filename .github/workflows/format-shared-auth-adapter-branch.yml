name: format-shared-auth-adapter-branch

on:
  push:
    branches: [agent/shared-auth-dual-guard]
    paths:
      - "adapters/shared-auth-rust/src/**"
      - ".github/workflows/format-shared-auth-adapter-branch.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/shared-auth-dual-guard
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Format and commit once
        run: |
          cargo fmt --manifest-path adapters/shared-auth-rust/Cargo.toml --all
          if git diff --quiet -- adapters/shared-auth-rust/src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adapters/shared-auth-rust/src
          git commit -m "style(auth): apply Rust 1.95 formatting"
          git push origin HEAD:agent/shared-auth-dual-guard
