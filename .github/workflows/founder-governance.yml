name: founder-governance

on:
  push:
    branches: [main]
    paths:
      - "design/founder-governance*"
      - "src/founder-governance*"
      - "schema/index.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/founder-governance.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "design/founder-governance*"
      - "src/founder-governance*"
      - "schema/index.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/founder-governance.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founder-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify Founder Control Plane design gates
        run: npm run test:founder-governance
