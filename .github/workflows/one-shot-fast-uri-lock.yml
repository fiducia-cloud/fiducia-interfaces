name: one-shot fast-uri lock repair

on:
  push:
    branches:
      - 'alexanderdmills/den-3330-peer-source-provenance'
    paths:
      - '.github/workflows/one-shot-fast-uri-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-fast-uri-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-audited-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Validate this one-shot workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/one-shot-fast-uri-lock.yml

      - name: Install repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Regenerate only the vulnerable transitive lock entry
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm update fast-uri --package-lock-only --ignore-scripts --no-audit --no-fund

          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const entry = lock.packages?.['node_modules/fast-uri'];
          if (!entry) throw new Error('package-lock.json lacks node_modules/fast-uri');
          if (entry.version !== '3.1.6') {
            throw new Error(`expected fast-uri 3.1.6, got ${entry.version}`);
          }
          if (entry.resolved !== 'https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.6.tgz') {
            throw new Error(`unexpected fast-uri resolved URL: ${entry.resolved}`);
          }
          if (entry.integrity !== 'sha512-7Ical1vFEMr0onbVzEDIreM22I4khW+fzyQPwvAFWBp1iwdshSZRsL4jjRvPG9JP1uiqMHRto+YU6R2/CzDz5Q==') {
            throw new Error(`unexpected fast-uri integrity: ${entry.integrity}`);
          }
          NODE

          changed="$(git diff --name-only)"
          test "${changed}" = 'package-lock.json'

      - name: Verify clean install, package contract, tests, and audit
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:package
          node --test src/check-peer-contract-sources.test.mjs
          npm audit --audit-level=high

      - name: Commit the audited lock and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-fast-uri-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/one-shot-fast-uri-lock.yml
          git diff --cached --check
          git commit -m 'fix(deps): update fast-uri to patched 3.1.6'
          git push origin "HEAD:${GITHUB_REF_NAME}"
