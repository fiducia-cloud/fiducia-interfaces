name: package-contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/package-contract.yml"
      - "package.json"
      - "package-lock.json"
      - "schema/**"
      - "sql/**"
      - "generated/**"
      - "src/package-contract.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/package-contract.yml"
      - "package.json"
      - "package-lock.json"
      - "schema/**"
      - "sql/**"
      - "generated/**"
      - "src/package-contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packed-exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/ci.yml ./.github/workflows/cli-flags.yml ./.github/workflows/founder-governance.yml ./.github/workflows/package-contract.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"
          cache: npm
      - name: Install the locked generator and validation toolchain
        run: npm ci --ignore-scripts
      - name: Verify packed exports and artifact allowlist
        run: npm run test:package
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high
