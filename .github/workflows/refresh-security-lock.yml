name: refresh-security-lock

on:
  push:
    branches:
      - agent/zed-package-contract
    paths:
      - ".github/workflows/refresh-security-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-security-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Apply the minimal npm audit lockfile fix
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
          cache: npm

      - name: Refresh only vulnerable lockfile resolutions
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=high
          git diff --check

      - name: Commit the reviewed lockfile delta
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already contains the patched resolution"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh audited npm lockfile"
          git push origin HEAD:agent/zed-package-contract
