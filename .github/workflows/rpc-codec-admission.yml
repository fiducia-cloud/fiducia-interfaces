name: RPC binary codec admission
on:
  pull_request:
    paths:
      - 'src/rpc-payload-admission.mjs'
      - 'src/rpc-payload-admission.test.mjs'
      - 'contracts/rpc-payload-codecs/**'
      - '.github/workflows/rpc-codec-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary-codec-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Fail-closed payload framing and byte-preservation regression
        run: node --test src/rpc-payload-admission.test.mjs
