name: secrets-audit

# Fail-closed, key-independent audit. Pull-request CI receives no age identity
# and never decrypts or prints secret values.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned just
        env:
          JUST_VERSION: 1.51.0
          JUST_ARCHIVE_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_ARCHIVE_SHA256}  /tmp/just.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Verify keyless encrypted-environment policy
        env:
          SOPS_AGE_KEY: ""
          SOPS_AGE_KEY_FILE: ""
        run: |
          set -euo pipefail
          just env-check
