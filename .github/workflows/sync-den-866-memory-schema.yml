name: sync DEN-866 memory schema

on:
  push:
    branches:
      - agent/den-866-governed-memory-schema
    paths:
      - .github/workflows/sync-den-866-memory-schema.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the memory branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-866-governed-memory-schema
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - name: Register the memory SQL plane and package exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          generator = Path("src/generate-db.mjs")
          source = generator.read_text()
          needle = '  { name: "ai_agent_control_plane", file: "ai_agent_control_plane.sql" },\n'
          addition = needle + '  { name: "ai_agent_memory", file: "ai_agent_memory.sql" },\n'
          if 'name: "ai_agent_memory"' not in source:
              if needle not in source:
                  raise SystemExit("ai-agent control-plane generator entry not found")
              source = source.replace(needle, addition, 1)
              generator.write_text(source)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          exports = package["exports"]
          rebuilt = {}
          for key, value in exports.items():
              rebuilt[key] = value
              if key == "./sql/ai-agent-control-plane":
                  rebuilt["./sql/ai-agent-memory"] = "./sql/ai_agent_memory.sql"
              if key == "./db/ai-agent-control-plane":
                  rebuilt["./db/ai-agent-memory"] = "./generated/typescript/db/ai_agent_memory.ts"
          package["exports"] = rebuilt
          package_path.write_text(json.dumps(package, indent=2) + "\n")
          PY
      - name: Install and regenerate checked-in row contracts
        run: |
          npm ci --ignore-scripts
          npm run generate
          node --test src/ai-agent-memory-sql.test.mjs
          node src/generate-db.mjs --check
      - name: Review and commit the bounded generated change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          allowed='^(package.json|src/generate-db.mjs|generated/rust-db/src/ai_agent_memory.rs|generated/rust-db/src/lib.rs|generated/typescript/db/ai_agent_memory.ts)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if test -n "$unexpected"; then
            echo "Generation changed unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet; then
            echo "Generated contracts already synchronized"
            exit 0
          fi
          git diff --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json src/generate-db.mjs generated/rust-db/src/ai_agent_memory.rs generated/rust-db/src/lib.rs generated/typescript/db/ai_agent_memory.ts
          git commit -m "DEN-866 generate governed memory row contracts"
          git push origin HEAD:agent/den-866-governed-memory-schema
