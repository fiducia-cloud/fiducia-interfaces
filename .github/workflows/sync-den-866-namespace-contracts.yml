name: sync DEN-866 namespace-safe contracts

on:
  push:
    branches:
      - agent/den-866-governed-memory-schema
    paths:
      - .github/workflows/sync-den-866-namespace-contracts.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the memory branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-866-governed-memory-schema
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - name: Regenerate and validate memory row contracts
        run: |
          npm ci --ignore-scripts
          node src/generate-db.mjs
          node --test src/ai-agent-memory-sql.test.mjs
          node src/generate-db.mjs --check
      - name: Commit only generated memory contract changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          allowed='^(generated/rust-db/src/ai_agent_memory.rs|generated/typescript/db/ai_agent_memory.ts)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if test -n "$unexpected"; then
            echo "Generation changed unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet; then
            echo "Generated memory contracts already synchronized"
            exit 0
          fi
          git diff --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/rust-db/src/ai_agent_memory.rs generated/typescript/db/ai_agent_memory.ts
          git commit -m "DEN-866 regenerate namespace-safe memory contracts"
          git push origin HEAD:agent/den-866-governed-memory-schema
