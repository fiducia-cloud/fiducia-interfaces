[package]
org = "fiducia"
name = "fiducia-interfaces"
version = "0.1.0"
description = "Canonical Fiducia coordination, sync, database, and generated language contracts"
license = "MIT"
keywords = ["interfaces", "coordination", "sync", "postgres", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-interfaces"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/schema/index.json\" && test -f \"$ZED_PKG_TEST_TARGET/sql/customer.sql\" && test -f \"$ZED_PKG_TEST_TARGET/sql/admin.sql\""
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "tmp/**", "**/*.log", ".DS_Store", "**/target/**", "**/node_modules/**", "**/.dart_tool/**"]

[targets.repository]
dir = "."
name = "fiducia-interfaces-repository"

[targets.rust]
dir = "generated/rust"
adapter = "rust"

[targets.rust-wasm]
dir = "generated/rust-wasm"
adapter = "node"
ecosystem = "npm"

[targets.rust-db]
dir = "generated/rust-db"
name = "fiducia-interfaces-rust-db"
adapter = "rust"
ecosystem = "cargo"

[targets.typescript]
dir = "generated/typescript"
adapter = "node"

[targets.dart]
dir = "generated/dart"
adapter = "dart"

[targets.python]
dir = "generated/python"
adapter = "python"

[targets.golang]
dir = "generated/go"
adapter = "go"

[targets.sql]
dir = "sql"
adapter = "none"

[scripts]
test = "npm test"
